[package]
name = "bk-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.3"
calamine = { version = "0.26", features = ["dates"] }
regex = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
rust_xlsxwriter = "0.102"

[dev-dependencies]
