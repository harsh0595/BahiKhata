[package]
name = "bahikhata"
version = "0.1.0"
description = "Bahi-Khata: offline bank statement analyser"
edition = "2021"
publish = false

[lib]
name = "bahikhata_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bk-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
